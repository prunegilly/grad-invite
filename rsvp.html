<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grad RSVP List</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  min-height: 100vh;
  background-color: #6B0038;
  background-image:
    radial-gradient(circle at 15% 20%, #A0004A 0%, transparent 40%),
    radial-gradient(circle at 85% 10%, #500025 0%, transparent 38%),
    radial-gradient(circle at 50% 92%, #880040 0%, transparent 35%),
    radial-gradient(circle at 4%  65%, #BB0055 0%, transparent 28%),
    radial-gradient(circle at 96% 55%, #420018 0%, transparent 30%);
  font-family: 'Fredoka One', cursive;
  padding: 40px 20px 60px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: radial-gradient(circle, rgba(255,255,255,0.10) 1px, transparent 1px);
  background-size: 20px 20px;
  pointer-events: none;
}

.card {
  position: relative;
  z-index: 1;
  background: #fff;
  border: 4px solid #FF1493;
  border-radius: 24px;
  padding: 30px 28px;
  width: 100%;
  max-width: 480px;
  box-shadow: 8px 8px 0 #FF1493, 13px 13px 0 #FFD700;
}

h1 {
  font-family: 'Caveat', cursive;
  font-size: 36px;
  font-weight: 700;
  color: #FF1493;
  text-align: center;
  margin-bottom: 4px;
  text-shadow: 2px 2px 0 #FFD700;
}

.subtitle {
  font-family: 'Caveat', cursive;
  font-size: 17px;
  color: #888;
  text-align: center;
  margin-bottom: 24px;
  letter-spacing: 1px;
}

.counts {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
}

.count-box {
  flex: 1;
  border-radius: 14px;
  padding: 14px 10px;
  text-align: center;
}
.count-box.yes { background: #f0fff0; border: 2px solid #22aa00; }
.count-box.no  { background: #fff0f0; border: 2px solid #cc1100; }
.count-box .num {
  font-size: 36px;
  line-height: 1;
  display: block;
}
.count-box.yes .num { color: #22aa00; }
.count-box.no  .num { color: #cc1100; }
.count-box .lbl {
  font-family: 'Caveat', cursive;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 2px;
  margin-top: 4px;
  display: block;
}
.count-box.yes .lbl { color: #22aa00; }
.count-box.no  .lbl { color: #cc1100; }

.section-label {
  font-family: 'Caveat', cursive;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 3px;
  color: #aaa;
  text-transform: uppercase;
  margin-bottom: 10px;
}

.rsvp-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 24px;
  min-height: 40px;
}

.rsvp-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #fafafa;
  border: 1.5px solid #eee;
  border-radius: 12px;
  padding: 10px 14px;
}

.rsvp-name {
  font-size: 17px;
  color: #1a1a1a;
}

.rsvp-badge {
  font-family: 'Caveat', cursive;
  font-size: 14px;
  font-weight: 700;
  padding: 3px 12px;
  border-radius: 20px;
  letter-spacing: 1px;
}
.badge-yes { background: #e0ffe0; color: #22aa00; border: 1.5px solid #22aa00; }
.badge-no  { background: #ffe0e0; color: #cc1100; border: 1.5px solid #cc1100; }

.rsvp-time {
  font-family: monospace;
  font-size: 10px;
  color: #ccc;
  margin-top: 2px;
}

.empty-msg {
  font-family: 'Caveat', cursive;
  font-size: 18px;
  color: #ccc;
  text-align: center;
  padding: 20px 0;
}

.btn-clear {
  display: block;
  width: 100%;
  background: none;
  border: 2px dashed #ddd;
  border-radius: 12px;
  padding: 10px;
  font-family: 'Caveat', cursive;
  font-size: 16px;
  font-weight: 700;
  color: #ccc;
  cursor: pointer;
  margin-top: 8px;
  transition: all 0.2s;
}
.btn-clear:hover { border-color: #cc1100; color: #cc1100; }

.back-link {
  margin-top: 28px;
  font-family: 'Caveat', cursive;
  font-size: 18px;
  font-weight: 700;
  color: #FFD0E8;
  text-decoration: none;
  letter-spacing: 2px;
  text-shadow: 0 0 10px rgba(255,20,147,0.4);
}
.back-link:hover { color: #fff; }

</style>
</head>
<body>

<div class="card">
  <h1>RSVP List</h1>
  <div class="subtitle">grad day · july 17 · 2026</div>

  <div class="counts">
    <div class="count-box yes">
      <span class="num" id="countYes">0</span>
      <span class="lbl">COMING</span>
    </div>
    <div class="count-box no">
      <span class="num" id="countNo">0</span>
      <span class="lbl">CANT MAKE IT</span>
    </div>
  </div>

  <div class="section-label">Responses</div>
  <ul class="rsvp-list" id="rsvpList">
    <li class="empty-msg" id="emptyMsg">loading...</li>
  </ul>

  <button class="btn-clear" id="btnClear">clear all RSVPs</button>
</div>

<a class="back-link" href="index.html">back to invite</a>

<script>
const API_BASE = 'https://grad-invite-api.onrender.com';

async function loadRSVPs() {
  const res = await fetch(`${API_BASE}/api/rsvps`);
  if (!res.ok) throw new Error(`request failed: ${res.status}`);
  return res.json();
}

function renderList(list) {
  const listEl  = document.getElementById('rsvpList');
  const emptyEl = document.getElementById('emptyMsg');
  const yesEl   = document.getElementById('countYes');
  const noEl    = document.getElementById('countNo');

  const yes = list.filter(r => r.status === 'yes');
  const no  = list.filter(r => r.status === 'no');

  yesEl.textContent = yes.length;
  noEl.textContent  = no.length;

  // clear existing items (keep emptyMsg)
  listEl.querySelectorAll('.rsvp-item').forEach(el => el.remove());

  if (list.length === 0) {
    emptyEl.style.display = 'block';
    emptyEl.textContent = 'no RSVPs yet... share the link!';
    return;
  }
  emptyEl.style.display = 'none';

  // already sorted yes-first by the API; just render in order
  list.forEach(r => {
    const li = document.createElement('li');
    li.className = 'rsvp-item';

    const nameDiv = document.createElement('div');
    const nameSpan = document.createElement('div');
    nameSpan.className = 'rsvp-name';
    nameSpan.textContent = r.name;

    const timeSpan = document.createElement('div');
    timeSpan.className = 'rsvp-time';
    timeSpan.textContent = new Date(r.created_at).toLocaleString('en-AU', {
      day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'
    });

    nameDiv.appendChild(nameSpan);
    nameDiv.appendChild(timeSpan);

    const badge = document.createElement('span');
    badge.className = 'rsvp-badge ' + (r.status === 'yes' ? 'badge-yes' : 'badge-no');
    badge.textContent = r.status === 'yes' ? 'coming' : 'cant make it';

    li.appendChild(nameDiv);
    li.appendChild(badge);
    listEl.appendChild(li);
  });
}

async function render() {
  const emptyEl = document.getElementById('emptyMsg');
  emptyEl.style.display = 'block';
  emptyEl.textContent = 'loading...';

  try {
    const list = await loadRSVPs();
    renderList(list);
  } catch (err) {
    console.log('failed to load RSVPs:', err);
    document.getElementById('rsvpList').querySelectorAll('.rsvp-item').forEach(el => el.remove());
    emptyEl.style.display = 'block';
    emptyEl.textContent = "couldn't load RSVPs - try refreshing";
  }
}

document.getElementById('btnClear').addEventListener('click', async () => {
  if (!confirm('Clear all RSVPs? This cannot be undone.')) return;
  const secret = prompt('Enter clear secret:');
  if (!secret) return;
  try {
    const res = await fetch(`${API_BASE}/api/rsvps`, {
      method: 'DELETE',
      headers: { 'X-Clear-Secret': secret },
    });
    if (!res.ok) throw new Error(`request failed: ${res.status}`);
    render();
  } catch (err) {
    console.log('failed to clear RSVPs:', err);
    alert("couldn't clear RSVPs - check the secret and try again");
  }
});

render();
</script>
</body>
</html>
